name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests without network
        run: python -m unittest discover -s tests -v
      - name: Generate sample outputs
        run: python -m domestic_energy demo --out-dir reports/demo
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run browser scenario tests
        run: node --test tests/behaviour.test.mjs tests/meter_analysis.test.mjs
      - name: Generate synthetic intervention examples
        run: python -m scripts.run_behaviour_study --out reports/behaviour_changes
